# Pull requests: checks and the static export. main: the same, then deploy/deploy.sh ships it
# to the server. Roll back: see deploy/deploy.sh.
name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next typegen: LayoutProps and the other route types live in .next/types, which a fresh
      # checkout lacks.
      - name: Checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm exec next typegen
          pnpm typecheck
          pnpm test
      - name: Build
        env:
          # Public values only, so this also runs for pull requests from forks.
          VERCEL_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dither-studio.aerixity.com' }}
        run: |
          pnpm build
          test -f out/index.html && test -f out/404.html
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_V2 }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: deploy/deploy.sh
