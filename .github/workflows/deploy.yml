name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Roll back to a release id (<sha>-<run>) or a SHA still on the server. Empty builds and deploys the current commit.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
    uses: dm3yb/workflows/.github/workflows/deploy-static.yml@v1
    secrets: inherit
    with:
      site: dither-studio
      public-url: https://dither-studio.aerixity.com
      sha: ${{ inputs.sha }}
      package-manager: pnpm
      node-version-file: .nvmrc
      lint: pnpm format:check && pnpm lint
      typecheck: pnpm exec next typegen && pnpm typecheck
      test: pnpm test
      build: pnpm build
      build-env: |
        {
          "VERCEL_ENV": "production",
          "NEXT_PUBLIC_SITE_URL": "${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dither-studio.aerixity.com' }}"
        }
