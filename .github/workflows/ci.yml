name: ci

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: dm3yb/workflows/.github/workflows/ci-next.yml@v1
    with:
      package-manager: pnpm
      node-version-file: .nvmrc
      # The same checks as `pnpm check`, split into parallel jobs.
      lint: pnpm format:check && pnpm lint
      # LayoutProps and the other route types live in .next/types, which a fresh checkout lacks.
      typecheck: pnpm exec next typegen && pnpm typecheck
      test: pnpm test
      build: pnpm build
      # Public values only, so this also runs for pull requests from forks.
      build-env: |
        {
          "VERCEL_ENV": "production",
          "NEXT_PUBLIC_SITE_URL": "${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dither-studio.aerixity.com' }}"
        }
      export-dir: out
