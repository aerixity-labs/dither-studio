# Checks and the static export, for pull requests and main. Deploys are not here: on a push to
# main, the aerixity-cloud panel builds the commit on the server and puts it live (build env: the
# panel's Environment tab). Roll back in the panel: Releases, Make live.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next typegen: LayoutProps and the other route types live in .next/types, which a fresh
      # checkout lacks.
      - name: Checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm exec next typegen
          pnpm typecheck
          pnpm test
      - name: Build
        env:
          # Public values only, so this also runs for pull requests from forks.
          VERCEL_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dither-studio.aerixity.com' }}
        run: |
          pnpm build
          test -f out/index.html && test -f out/404.html
