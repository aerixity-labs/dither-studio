# dither-studio.aerixity.com → the static export of the live release.
# The server reads this file from the live release.
server {
  server_name dither-studio.aerixity.com;
  ssl_certificate /etc/nginx/tls/aerixity.com.crt;
  ssl_certificate_key /etc/nginx/tls/aerixity.com.key;
  include /srv/infra/server/nginx/https.conf;
  client_max_body_size 2m;
  root /srv/static/dither-studio/current/out;
  include /srv/infra/server/nginx/static.conf;
}
